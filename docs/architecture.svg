<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 550" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Orbit: Vercel and Neon pilot architecture</title>
  <desc id="desc">Browsers use one HTTPS Vercel origin. Server-side Node functions authenticate a shared workspace password, validate state and write versioned snapshots to Neon PostgreSQL. Individual SSO, record-level permissions, real calendar sync and scheduled email are planned, not implemented.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#2563eb"/></marker>
    <style>
      .heading { font-size: 20px; font-weight: 600; fill: #0f172a; }
      .title { font-size: 14px; font-weight: 600; fill: #0f172a; }
      .body { font-size: 12px; fill: #475569; }
      .label { font-size: 11px; font-weight: 600; fill: #2563eb; }
      .card { fill: white; stroke: #cbd5e1; }
      .future { fill: #f8fafc; stroke: #cbd5e1; stroke-dasharray: 5 4; }
    </style>
  </defs>
  <rect width="1080" height="550" fill="#f1f5f9"/>
  <text x="36" y="42" class="heading">Orbit — existing Vercel project + Neon Free</text>
  <text x="36" y="65" class="body">Implemented shared pilot · account setup required · all password holders have full workspace access</text>

  <rect x="36" y="108" width="245" height="206" rx="12" class="card"/>
  <text x="56" y="138" class="label">ANY DEVICE / LOCATION</text>
  <text x="56" y="166" class="title">Browser + React portal</text>
  <text x="56" y="192" class="body">Calendar · activities · timesheets</text>
  <text x="56" y="214" class="body">Roadmap · scores · master setup</text>
  <text x="56" y="246" class="body">HttpOnly session cookie</text>
  <text x="56" y="268" class="body">Persona preference stays local</text>
  <text x="56" y="290" class="body">Unsaved changes: export + retry</text>

  <rect x="376" y="108" width="325" height="206" rx="12" class="card"/>
  <text x="396" y="138" class="label">EXISTING VERCEL PROJECT</text>
  <text x="396" y="166" class="title">GitHub main → SPA + Node API</text>
  <text x="396" y="192" class="body">/api/config · /api/session · /api/workspace</text>
  <text x="396" y="214" class="body">Password gate · schema validation</text>
  <text x="396" y="246" class="body">Database credentials stay server-side</text>
  <text x="396" y="268" class="body">Same-origin requests · no public SQL access</text>
  <text x="396" y="290" class="body">No continuous polling or keep-alive cron</text>

  <rect x="791" y="108" width="253" height="206" rx="12" class="card"/>
  <text x="811" y="138" class="label">NEON FREE POSTGRESQL</text>
  <text x="811" y="166" class="title">Single pilot workspace</text>
  <text x="811" y="192" class="body">Versioned JSONB snapshot</text>
  <text x="811" y="214" class="body">Persistent sign-in attempt limits</text>
  <text x="811" y="246" class="body">Atomic revision checks</text>
  <text x="811" y="268" class="body">Stale saves return HTTP 409</text>
  <text x="811" y="290" class="body">4 MB API snapshot limit</text>

  <path d="M281 198 H370" stroke="#2563eb" stroke-width="1.7" marker-end="url(#arrow)"/>
  <text x="298" y="185" class="label">HTTPS</text>
  <path d="M701 198 H785" stroke="#2563eb" stroke-width="1.7" marker-end="url(#arrow)"/>
  <text x="713" y="185" class="label">HTTPS SQL</text>

  <text x="36" y="358" class="title">Planned — not live production features</text>
  <rect x="36" y="378" width="318" height="91" rx="10" class="future"/>
  <text x="54" y="405" class="title">Individual identity + permissions</text>
  <text x="54" y="429" class="body">SSO · tenant isolation · server-side role checks</text>
  <text x="54" y="449" class="body">Normalized records · immutable audit trail</text>
  <rect x="381" y="378" width="318" height="91" rx="10" class="future"/>
  <text x="399" y="405" class="title">Real calendar connectors</text>
  <text x="399" y="429" class="body">Microsoft Graph / Google OAuth + durable queue</text>
  <text x="399" y="449" class="body">Today: simulated connectors; real .ics export</text>
  <rect x="726" y="378" width="318" height="91" rx="10" class="future"/>
  <text x="744" y="405" class="title">Scheduled operations</text>
  <text x="744" y="429" class="body">Escalation delivery · recovery · monitoring</text>
  <text x="744" y="449" class="body">Today: scores + generated email text only</text>
  <text x="36" y="514" class="body">See docs/DEPLOYMENT.md · free-tier quotas and Vercel Hobby eligibility apply · not suitable for sensitive staff data yet</text>
</svg>
